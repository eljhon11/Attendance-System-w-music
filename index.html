<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Audio Visualizer -->
    <canvas id="visualizer"></canvas>
    
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-user-graduate"></i>
                <span>KB Attendance System with music player</span>
            </div>
            
            <div class="user-controls">
                <div class="music-control" id="musicToggle">
                    <i class="fas fa-music"></i>
                    <span id="nowPlaying">No song selected</span>
                    <i class="fas fa-pause" id="playPauseIcon"></i>
                </div>
                <div class="user-profile">
                    <div class="avatar">AD</div>
                    <span>El Jhon Sama the Admin</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <nav class="sidebar">
                <ul>
                    <li class="active"><i class="fas fa-calendar-check"></i> Attendance</li>
                    <li><i class="fas fa-users"></i> Students</li>
                    <li><i class="fas fa-chalkboard"></i> Classes</li>
                    <li><i class="fas fa-chart-pie"></i> Reports</li>
                    <li><i class="fas fa-cog"></i> Settings</li>
                </ul>
            </nav>

            <main class="dashboard">
                <div class="dashboard-header">
                    <h2>Today's Attendance</h2>
                    <button class="btn primary" id="addBtn">
                        <i class="fas fa-plus"></i> Add Record
                    </button>
                </div>

                <div class="filters">
                    <div class="search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search...">
                    </div>
                    <select id="classFilter">
                        <option value="all">All Classes</option>
                        <option value="FSD-101">FSD-101</option>
                        <option value="FSD-102">FSD-102</option>
                    </select>
                    <select id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                    <input type="date" id="dateFilter">
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Class</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTable">
                            <!-- Filled by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <button id="prevPage"><i class="fas fa-chevron-left"></i></button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button id="nextPage"><i class="fas fa-chevron-right"></i></button>
                </div>
            </main>
        </div>
    </div>

    <!-- Music Player Modal -->
    <div class="modal" id="musicModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Music Player</h3>
                <button class="close" id="closeMusicModal">&times;</button>
            </div>
            <div class="modal-body">
                <ul class="song-list" id="songList">
                    <!-- Filled by JavaScript -->
                </ul>
                <div class="volume-control">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                </div>
                <audio id="audioPlayer"></audio>
            </div>
        </div>
    </div>

    <!-- Add Record Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Attendance Record</h3>
                <button class="close" id="closeAddModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="attendanceForm">
                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" required>
                    </div>
                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" required>
                    </div>
                    <div class="form-group">
                        <label for="studentClass">Class</label>
                        <select id="studentClass" required>
                            <option value="FSD-101">FSD-101</option>
                            <option value="FSD-102">FSD-102</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" required>
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Late">Late</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="time">Time</label>
                        <input type="time" id="time">
                    </div>
                    <button type="submit" class="btn primary">Save</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
